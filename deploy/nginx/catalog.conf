worker_processes 1;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    log_format g4 '$request_method $uri status=$status upstream=$upstream_addr '
                  'upstream_status=$upstream_status time=$request_time';
    access_log /dev/stdout g4;

    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream catalog_backends {
        zone catalog_backends 64k;
        server api-a:8080 resolve;
        server api-b:8080 resolve;
        keepalive 8;
    }

    upstream login_backend {
        zone login_backend 64k;
        server api-a:8080 resolve;
    }

    upstream api_backends {
        zone api_backends 64k;
        server api-a:8080 resolve;
        server api-b:8080 resolve;
        keepalive 16;
    }

    upstream hub_backends {
        zone hub_backends 64k;
        ip_hash;
        server api-a:8080 resolve;
        server api-b:8080 resolve;
    }

    server {
        listen 8088;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        location = /api/catalog/random {
            limit_except GET {
                deny all;
            }
            proxy_pass http://catalog_backends;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            add_header X-G4-Upstream $upstream_addr always;
        }

        location = /api/auth/login {
            limit_except POST {
                deny all;
            }
            proxy_pass http://login_backend;
            proxy_next_upstream off;
        }

        location /hubs/ {
            proxy_pass http://hub_backends;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://api_backends;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

        location / {
            return 404;
        }
    }
}
