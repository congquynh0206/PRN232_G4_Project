
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: g4-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=G4@123456Strong!
    ports:
      - "14333:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - g4-net

  backend:
    build:
      context: .
      dockerfile: backend/G4.Api/Dockerfile
    container_name: g4-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CloneEbayDB;User Id=sa;Password=G4@123456Strong!;TrustServerCertificate=True;
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    networks:
      - g4-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: g4-mvc
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiSettings__BaseUrl=http://backend:8080 
    ports:
      - "5000:8080"
    depends_on:
      - backend
    networks:
      - g4-net

networks:
  g4-net:

volumes:
  sql_data:
  
      
#dotnet ef dbcontext scaffold "Server=localhost,14333;Database=CloneEbayDB;User Id=sa;Password=G4@123456Strong!;TrustServerCertificate=True;" Microsoft.EntityFrameworkCore.SqlServer -o Models -c ApplicationDbContext
